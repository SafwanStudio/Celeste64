name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Optional: recompile the HLSL shaders (needed for the custom look).
    # If anything fails here the original compiled shaders are kept and the build continues.
    - name: Compile shaders (optional)
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -e
        mkdir -p /tmp/sc && cd /tmp/sc
        gh release download --repo libsdl-org/SDL_shadercross --pattern "*windows*x64*" || gh release download --repo libsdl-org/SDL_shadercross --pattern "*win*"
        7z x -y ./*.zip > /dev/null
        SC_DIR="$(dirname "$(find . -iname 'shadercross.exe' | head -n 1)")"
        export PATH="$PWD/$SC_DIR:$PATH"
        cd "$GITHUB_WORKSPACE/Content/Shaders"
        cp -r Compiled Compiled_orig
        if bash compile.sh; then
          rm -rf Compiled_orig
        else
          rm -rf Compiled && mv Compiled_orig Compiled
          exit 1
        fi

    - name: Build
      run: |
        dotnet publish -c Release -r win-x64 -p:ImportByWildcardBeforeSolution=false -o build
        cp -r Content build

    - name: Upload game
      uses: actions/upload-artifact@v4
      with:
        name: Celeste64-Windows-x64
        path: build
